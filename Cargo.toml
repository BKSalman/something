[package]
name = "something"
version = "0.1.0"
authors = ["Salman Abuhaimed <salman.f.abuhaimed@gmail.com>"]
edition = "2024"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
dioxus = { version = "0.7.0-rc.0", features = ["router", "fullstack"] }
dioxus-devtools = { version = "0.7.0-rc.0", features = ["serve"], optional = true }
tokio = { version = "1", features = ["full"], optional = true }
axum = { version = "0.8", features = ["macros", "multipart"], optional = true }
tracing = "0.1.41"

[features]
default = ["web"]
web = ["dioxus/web"]
desktop = ["dioxus/desktop"]
mobile = ["dioxus/mobile"]
server = ["dioxus/server", "dep:tokio", "dep:dioxus-devtools", "dep:axum"]

[patch.crates-io]
dioxus = { path = "../dioxus/packages/dioxus" }
dioxus-devtools = { path = "../dioxus/packages/devtools" }
